# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -s escape-time 0          # no delay for escape key
set -g focus-events on
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Keybindings ───────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with shift+arrow
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move between windows with Alt+arrow (no prefix needed)
bind -n M-Left  previous-window
bind -n M-Right next-window

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom

# Colors
set -g status-style                "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-style           "bg=#89b4fa,fg=#1e1e2e"
set -g status-right-style          "bg=#1e1e2e,fg=#585b70"
set -g window-status-style         "bg=#1e1e2e,fg=#585b70"
set -g window-status-current-style "bg=#313244,fg=#cdd6f4,bold"
set -g pane-border-style           "fg=#313244"
set -g pane-active-border-style    "fg=#89b4fa"
set -g message-style               "bg=#f38ba8,fg=#1e1e2e"

# Content
set -g status-left  " #S "
set -g status-right " %H:%M  %d %b "
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
